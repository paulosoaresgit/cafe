<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Checkout responsive verification</title><style>body{margin:0;padding:16px;background:#ececec;font-family:Arial,sans-serif}label{display:block;margin-bottom:12px}select{padding:8px;margin-left:10px}iframe{flex:none;display:block;height:1500px;border:0;background:white;max-width:none;box-shadow:0 3px 20px #0002}main{display:flex;gap:20px;align-items:flex-start}.desktop{width:880px;height:920px}#mobile{width:390px}</style><label>Mobile viewport<select id="viewport"><option>320</option><option>360</option><option selected>390</option><option>430</option><option>768</option></select></label><main><iframe class="desktop" title="Desktop checkout" src="/02/checkout.html?colour=light-blue&quantity=1"></iframe><iframe id="mobile" title="Mobile checkout" src="/02/checkout.html?colour=black&quantity=2"></iframe></main><script>document.getElementById('viewport').onchange=e=>document.getElementById('mobile').style.width=e.target.value+'px';</script></html>
